apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckstore
  namespace: frontend
  labels:
    app: duck-web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duck-web
                port:
                  number: 80
