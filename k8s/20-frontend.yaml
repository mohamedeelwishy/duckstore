apiVersion: apps/v1
kind: Deployment
metadata:
  name: duck-web
  namespace: frontend
  labels:
    app: duck-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: duck-web
  template:
    metadata:
      labels:
        app: duck-web
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          # Bootstrap placeholder: The CI/CD pipeline overrides this tag with an immutable Git SHA
          image: ghcr.io/mohamedeelwishy/duckstore-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_URL
              value: http://duck-api.backend.svc.cluster.local:3000
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # CPU limits are intentionally omitted to prevent CFS throttling during traffic bursts.
              # Memory limit is strictly enforced to protect the host against leaks and OOM conditions.
              memory: 192Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: duck-web
  namespace: frontend
  labels:
    app: duck-web
spec:
  type: ClusterIP
  selector:
    app: duck-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
