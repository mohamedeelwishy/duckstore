name: CI Build & Push to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
      - "kargo/**"
      - "argocd/**"
      - "*.md"
      - "**/*.md"
      - ".gitignore"

env:
  AWS_REGION: eu-west-1
  ECR_BACKEND_REPO: duckstore-backend
  ECR_FRONTEND_REPO: duckstore-frontend

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node.js syntax checks
        run: |
          node --check app/backend/server.js
          node --check app/frontend/server.js

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform checks
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  build-and-push:
    name: Build & Push Images to AWS ECR
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push DuckStore Backend
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          file: app/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest

      - name: Build and push DuckStore Frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: app/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
             
