apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: duckstore
  labels:
    app.kubernetes.io/part-of: duckstore
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: duckstore-warehouse
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/mohamedeelwishy/duckstore.git
        - name: backendImageRepo
          value: 307498582744.dkr.ecr.eu-west-1.amazonaws.com/duckstore-backend
        - name: frontendImageRepo
          value: 307498582744.dkr.ecr.eu-west-1.amazonaws.com/duckstore-frontend
      steps:
        # Step 1: Clone the Git repository into the promotion workspace
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./src

        # Step 2: Update container image tags inside Helm values.yaml
        - uses: yaml-update
          config:
            path: ./src/helm/duckstore/values.yaml
            updates:
              - key: backend.image.tag
                value: ${{ imageFrom(vars.backendImageRepo).Tag }}
              - key: frontend.image.tag
                value: ${{ imageFrom(vars.frontendImageRepo).Tag }}

        # Step 3: Commit values.yaml changes with [skip ci] to prevent CI loops
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: "chore(kargo): promote duckstore freight to prod [skip ci]"

        # Step 4: Push updated Helm values back to the main branch
        - uses: git-push
          config:
            path: ./src
            targetBranch: main
