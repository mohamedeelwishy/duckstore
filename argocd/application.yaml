apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckstore
  namespace: argocd
  labels:
    app.kubernetes.io/name: duckstore
    app.kubernetes.io/part-of: duckstore
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mohamedeelwishy/duckstore.git
    targetRevision: main
    # Point directly to the structured Helm chart directory instead of legacy raw manifests
    path: helm/duckstore
    helm:
      # Optional: Explicit release name to match the application name
      releaseName: duckstore
  destination:
    server: https://kubernetes.default.svc
    # Each template in helm/duckstore defines its explicit target namespace (frontend or backend)
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
