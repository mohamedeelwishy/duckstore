apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckstore
  namespace: argocd
  labels:
    app.kubernetes.io/name: duckstore
    app.kubernetes.io/part-of: duckstore
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Replaced Git repo URL with Helm repo or OCI registry URL 
    repoURL: https://charts.example.com/
    #  Specified chart name instead of Git directory path 
    chart: duckstore
    #  Uses chart version instead of a Git branch 
    targetRevision: 1.2.0
    #  Helm parameters and value overrides 
    helm:
      releaseName: duckstore
      valuesObject:
        replicaCount: 2
        image:
          tag: "v1.2.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: duckstore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
