apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckstore
  namespace: argocd
  labels:
    app.kubernetes.io/name: duckstore
    app.kubernetes.io/part-of: duckstore
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mohamedeelwishy/duckstore.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    # Each manifest in k8s/ defines its own explicit namespace (frontend or backend)
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
